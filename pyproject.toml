[tool.poetry]
name = "taskmanager"
version = "0.1.0"
description = "Task Manager API"
authors = ["Jay Shepherd"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.115.6"
uvicorn = "0.34.0"
python-dotenv = "^1.0.1"
itsdangerous = "^2.2.0"
sqlalchemy = "^2.0.37"
alembic = "^1.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
